openapi: 3.0.0
info: {title: numbered pages, version: v1}
servers:
  - url: https://api.example.com
x-stackQL-config:
  pagination:
    algorithm: page_number
    requestToken: {key: page, location: query}
    responseToken: {key: result_info.page, location: body}
    responseTerminator: {key: result_info.total_pages, location: body}
paths:
  /items:
    get:
      operationId: list_items
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object, properties: {id: {type: string}}}}
                  result_info:
                    type: object
                    properties:
                      page: {type: integer}
                      total_pages: {type: integer}
components:
  x-stackQL-resources:
    items:
      id: numbered.things.items
      name: items
      methods:
        list:
          operation: {$ref: '#/paths/~1items/get'}
          response: {mediaType: application/json, openAPIDocKey: '200', objectKey: items}
      sqlVerbs:
        select: [{$ref: '#/components/x-stackQL-resources/items/methods/list'}]
